<div class="radar" aria-hidden="true">
  <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="floor-grid" patternUnits="userSpaceOnUse" width="20" height="20">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#131c2e" stroke-width="0.8" />
      </pattern>

      <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="neon-amber" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <linearGradient id="road-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0b121e" />
        <stop offset="50%" stop-color="#111a2c" />
        <stop offset="100%" stop-color="#0b121e" />
      </linearGradient>

      <!-- Auto en cyan: el que entra y se estaciona -->
      <g id="car-cyan">
        <rect x="-14" y="-28" width="28" height="56" rx="6" fill="#00f0ff" opacity="0.15" filter="url(#neon-cyan)" />
        <rect x="-13" y="-26" width="26" height="52" rx="5" fill="#0f2b3e" stroke="#00f0ff" stroke-width="1.5" />
        <path d="M -9 -10 L 9 -10 L 7 -2 L -7 -2 Z" fill="#00f0ff" opacity="0.6" />
        <path d="M -8 16 L 8 16 L 7 10 L -7 10 Z" fill="#003544" opacity="0.8" stroke="#00f0ff" stroke-width="0.8" />
        <rect x="-7" y="-2" width="14" height="12" rx="2" fill="#081824" stroke="#00d8e6" stroke-width="0.8" />
        <polygon points="-11,-26 -7,-26 -9,-22" fill="#ffffff" filter="url(#neon-cyan)" />
        <polygon points="11,-26 7,-26 9,-22" fill="#ffffff" filter="url(#neon-cyan)" />
        <polygon points="-12,-26 -18,-50 -2,-50 -8,-26" fill="#00f0ff" opacity="0.25" />
        <polygon points="12,-26 18,-50 2,-50 8,-26" fill="#00f0ff" opacity="0.25" />
        <line x1="-10" y1="26" x2="-4" y2="26" stroke="#ff6b6b" stroke-width="2" />
        <line x1="4" y1="26" x2="10" y2="26" stroke="#ff6b6b" stroke-width="2" />
      </g>

      <!-- Auto ya estacionado -->
      <g id="car-parked">
        <rect x="-13" y="-26" width="26" height="52" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
        <path d="M -9 -10 L 9 -10 L 7 -1 L -7 -1 Z" fill="#38bdf8" opacity="0.35" />
        <rect x="-7" y="-1" width="14" height="11" rx="2" fill="#0f172a" />
        <polygon points="-10,-26 -7,-26 -9,-23" fill="#cbd5e1" />
        <polygon points="10,-26 7,-26 9,-23" fill="#cbd5e1" />
      </g>

      <!-- Moto en ámbar, el color del logo -->
      <g id="moto-amber">
        <circle cx="0" cy="0" r="12" fill="#ffb95f" opacity="0.15" filter="url(#neon-amber)" />
        <rect x="-4" y="-14" width="8" height="28" rx="4" fill="#4a3200" stroke="#ffb95f" stroke-width="1.2" />
        <line x1="-9" y1="-8" x2="9" y2="-8" stroke="#ffd59e" stroke-width="2" />
        <circle cx="-9" cy="-8" r="1.5" fill="#ffddb8" />
        <circle cx="9" cy="-8" r="1.5" fill="#ffddb8" />
        <circle cx="0" cy="0" r="5" fill="#2a1700" stroke="#ffb95f" stroke-width="1" />
        <path d="M -3 -2 L 3 -2 L 2 1 L -2 1 Z" fill="#ffddb8" />
        <polygon points="0,-14 -10,-35 10,-35" fill="#ffb95f" opacity="0.25" />
        <circle cx="0" cy="14" r="1.5" fill="#ff6b6b" />
      </g>
    </defs>

    <!-- Piso y pasillo de circulación -->
    <rect width="100%" height="100%" fill="url(#floor-grid)" />
    <rect x="145" y="0" width="110" height="240" fill="url(#road-grad)" />
    <line x1="145" y1="0" x2="145" y2="240" stroke="#1e293b" stroke-width="2" />
    <line x1="255" y1="0" x2="255" y2="240" stroke="#1e293b" stroke-width="2" />

    <g fill="#00f0ff" opacity="0.3">
      <polygon points="200,60 193,48 207,48" />
      <rect x="198" y="38" width="4" height="12" />
      <polygon points="172,175 165,187 179,187" />
      <rect x="170" y="185" width="4" height="12" />
    </g>
    <line class="animated-lane" x1="185" y1="0" x2="185" y2="240" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.35" />

    <!-- Bahías de motos -->
    <rect x="25" y="25" width="105" height="40" rx="3" fill="#08101d" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="35" y="48" fill="#64748b" font-size="9" font-weight="600">M-01</text>
    <circle class="sensor-dot sensor-m1" cx="120" cy="45" r="4" />

    <rect x="25" y="75" width="105" height="40" rx="3" fill="#08101d" stroke="#1e293b" stroke-width="1.5" />
    <text x="35" y="98" fill="#64748b" font-size="9" font-weight="600">M-02</text>
    <circle cx="120" cy="95" r="4" fill="#ff6b6b" />
    <g transform="translate(75, 95) rotate(-90)">
      <use href="#moto-amber" />
    </g>

    <!-- Bahías de autos, lado izquierdo -->
    <rect x="15" y="130" width="115" height="48" rx="3" fill="#08101d" stroke="#1e293b" stroke-width="1.5" />
    <text x="25" y="158" fill="#64748b" font-size="9" font-weight="600">A-01</text>
    <circle cx="120" cy="154" r="4" fill="#ff6b6b" />
    <g transform="translate(72, 154) rotate(-90)">
      <use href="#car-parked" />
    </g>

    <rect x="15" y="185" width="115" height="48" rx="3" fill="#08101d" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="25" y="213" fill="#00f0ff" font-size="9" font-weight="600" opacity="0.8">A-02 LIBRE</text>
    <circle class="sensor-dot" cx="120" cy="209" r="4" fill="#00f0ff" filter="url(#neon-cyan)" />

    <!-- Bahías de autos, lado derecho -->
    <rect x="270" y="20" width="115" height="48" rx="3" fill="#08101d" stroke="#1e293b" stroke-width="1.5" />
    <text x="355" y="48" fill="#64748b" font-size="9" font-weight="600">B-01</text>
    <circle cx="280" cy="44" r="4" fill="#ff6b6b" />
    <g transform="translate(325, 44) rotate(90)">
      <use href="#car-parked" />
    </g>

    <rect x="270" y="96" width="115" height="48" rx="3" fill="#08101d" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="6 3" />
    <text x="346" y="124" fill="#00f0ff" font-size="8" font-weight="700" opacity="0.9">B-02 ASIGNADA</text>
    <circle class="sensor-dot sensor-b2" cx="280" cy="120" r="4" />
    <g stroke="#00f0ff" stroke-width="1.5" opacity="0.6">
      <line x1="285" y1="102" x2="295" y2="102" />
      <line x1="285" y1="102" x2="285" y2="112" />
      <line x1="285" y1="138" x2="295" y2="138" />
      <line x1="285" y1="138" x2="285" y2="128" />
    </g>

    <rect x="270" y="172" width="115" height="48" rx="3" fill="#08101d" stroke="#1e293b" stroke-width="1.5" />
    <text x="355" y="200" fill="#64748b" font-size="9" font-weight="600">B-03</text>
    <circle cx="280" cy="196" r="4" fill="#ff6b6b" />
    <g transform="translate(325, 196) rotate(90)">
      <use href="#car-parked" />
    </g>

    <!-- Vehículos en movimiento -->
    <g class="moving-car">
      <use href="#car-cyan" />
    </g>
    <g class="moving-moto">
      <use href="#moto-amber" />
    </g>

    <!-- Insignia de estado -->
    <g transform="translate(14, 10)">
      <rect width="118" height="14" rx="7" fill="#0f172a" opacity="0.9" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="10" cy="7" r="3" fill="#65f2b5" filter="url(#neon-amber)" />
      <text x="18" y="10.5" fill="#b9cacb" font-size="7.5" font-weight="700" letter-spacing="0.5">SISTEMA DE CÁMARAS</text>
    </g>
  </svg>
</div>
