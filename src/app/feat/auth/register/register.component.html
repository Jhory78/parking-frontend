<div class="auth-container">
    <div class="auth-card">
        <h1>Parking System</h1>
        <h2>Crear cuenta</h2>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="field">
                <label>Nombre</label>
                <input
                        type="text"
                        formControlName="nombre"
                        placeholder="Nombre completo"
                        [class.invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched"
                />
                <span class="hint" *ngIf="form.get('nombre')?.hasError('required') && form.get('nombre')?.touched">
            El nombre es requerido
                </span>
            </div>

            <div class="field">
                <label>Correo</label>
                <input
                        type="email"
                        formControlName="correo"
                        placeholder="usuario@email.com"
                        [class.invalid]="form.get('correo')?.invalid && form.get('correo')?.touched"
                />
                <span class="hint" *ngIf="form.get('correo')?.hasError('required') && form.get('correo')?.touched">
          El correo es requerido
        </span>
                <span class="hint" *ngIf="form.get('correo')?.hasError('email') && form.get('correo')?.touched">
          Ingresa un correo válido
        </span>
            </div>

            <div class="field">
                <label>Contraseña</label>
                <input
                        type="password"
                        formControlName="password"
                        placeholder="Mínimo 8 caracteres"
                        [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
                />
                <span class="hint" *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched">
          La contraseña es requerida
        </span>
                <span class="hint" *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">
          Mínimo 8 caracteres (llevas {{ form.get('password')?.value?.length || 0 }})
                </span>
            </div>

            <div class="field">
                <label>Rol</label>
                <select formControlName="rol">
                    <option value="OPERARIO">Operario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <p class="error"   *ngIf="error">{{ error }}</p>
            <p class="success" *ngIf="success">{{ success }}</p>

            <button type="submit" [disabled]="loading || form.invalid">
                {{ loading ? 'Registrando...' : 'Crear cuenta' }}
            </button>
        </form>

        <p class="link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>
</div>
